[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anvil-agent"
version = "0.1.0"
description = "The open-source autonomous coding engine with a web studio UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sarthak Verma", email = "sarthakverma0802@gmail.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "tree-sitter>=0.21.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "toml>=0.10.2"
]

[project.scripts]
anvil = "anvil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["anvil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "RUF059", "B017"]

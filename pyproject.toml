[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sol-agent"
version = "0.1.0"
description = "The open-source autonomous coding engine with a web studio UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sarthak Verma", email = "sarthakverma0802@gmail.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.0",
    "gitpython>=3.1.42",
    "click>=8.1.7",
    "rich>=13.7.1",
    "toml>=0.10.2"
]

[project.scripts]
sol = "sol.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
